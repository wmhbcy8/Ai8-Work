name: Build and Release

permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: write

on:
  push:
    tags:
      - '*'
  # 手动触发：可选择分支/tag 构建（用于补发/重发 release）
  workflow_dispatch:

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  # 独立 code-quality job,供桌面构建和 web-cli 打包共用,避免重复跑
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Run ESLint
        run: bun run lint

      - name: Check Prettier formatting
        run: bun run format:check

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  build-pipeline:
    name: Build Pipeline
    uses: ./.github/workflows/_build-reusable.yml
    needs: code-quality
    # 正式 tag 推送或手动触发时构建（排除 -dev- tag，避免重复构建）
    if: vars.PUBLISH_RELEASE == 'true' && needs.code-quality.result == 'success' && ((startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')) || github.event_name == 'workflow_dispatch')
    with:
      skip_code_quality: true
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},
          {"platform":"macos-x64","os":"macos-14","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"},
          {"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"},
          {"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"},
          {"platform":"linux-x64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"},
          {"platform":"linux-arm64","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}
        ]}
    secrets: inherit

  pack-web-cli:
    name: Pack Web CLI
    uses: ./.github/workflows/pack-web-cli.yml
    needs: code-quality
    # 与桌面构建同频触发：正式 tag 或手动触发（排除 -dev- tag）
    if: vars.PUBLISH_RELEASE == 'true' && needs.code-quality.result == 'success' && ((startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')) || github.event_name == 'workflow_dispatch')
    with:
      ref: ''
      append_commit_hash: false
      skip_code_quality: true
    secrets: inherit

  # 自动重试 workflow（当构建失败时）
  auto-retry-workflow:
    name: Auto Retry on Build Failure
    runs-on: ubuntu-latest
    needs: build-pipeline
    # 关键：只在首次失败时触发，避免无限循环
    if: |
      failure() &&
      github.run_attempt == 1 &&
      (github.event_name == 'push' || github.event_name == 'schedule')

    steps:
      - name: Log retry information
        run: |
          echo "=========================================="
          echo "🔄 Auto retry triggered (first failure)"
          echo "=========================================="
          echo "Build failed on first attempt, preparing auto retry..."
          echo "Current attempt: ${{ github.run_attempt }}"
          echo "Wait strategy: 5 minutes cooldown before retry"
          echo "=========================================="

      - name: Wait before retry (5 min cooldown)
        run: |
          echo "⏳ Waiting 5 minutes before retry..."
          echo "Start: $(date)"
          sleep 300
          echo "End: $(date)"
          echo "Triggering retry..."

      - name: Trigger workflow rerun
        run: |
          echo "🔄 Triggering full workflow rerun (attempt 2)..."

          # Use re-run API (not rerun-failed-jobs, to avoid loops)
          response=$(curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -w "\n%{http_code}" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/rerun)

          http_code=$(echo "$response" | tail -n1)

          if [ "$http_code" = "201" ]; then
            echo ""
            echo "✅ Retry triggered successfully"
            echo "This will be attempt 2"
            echo "Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo ""
            echo "❌ Retry trigger failed, HTTP status: $http_code"
            echo "Response:"
            echo "$response" | head -n-1
            exit 1
          fi

  # 发布到 GitHub Releases（GitHub Releases 即自动更新源）
  # PUBLISH_RELEASE=true（本仓库）：要求构建成功并附带安装包；PUBLISH_RELEASE 未设置：纯源码 draft Release。
  # 触发方式：
  #   1. 推送正式 tag（如 v2.1.60）→ 自动构建 6 平台并创建 draft Release；
  #   2. 手动 workflow_dispatch → 用当前 package.json 版本创建/补发 release。
  # 发布后到 Releases 页面把 draft 转成正式发布，App 即可通过 electron-updater 自动更新。
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [code-quality, build-pipeline, pack-web-cli]
    if: always() && needs.code-quality.result == 'success' && ((startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')) || github.event_name == 'workflow_dispatch') && (vars.PUBLISH_RELEASE != 'true' || (needs.build-pipeline.result == 'success' && needs.pack-web-cli.result == 'success'))
    environment: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version for release
        id: version
        run: |
          # 判断触发来源：正式 tag 推送 or 手动触发
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "🚀 Creating stable release from tag: $TAG_NAME"
          else
            # workflow_dispatch 触发：使用当前 package.json 版本
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v$VERSION"
            echo "🚀 Creating release from workflow_dispatch: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      # 下游签名构建有安装包产物；纯源码 Release 无产物可下载
      - name: Download all build artifacts
        if: vars.PUBLISH_RELEASE == 'true'
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: Prepare release assets (normalize updater metadata)
        if: vars.PUBLISH_RELEASE == 'true'
        shell: bash
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.zip
            release-assets/**/*.yml
            release-assets/**/*.tar.gz
            release-assets/**/*.sha256
            release-assets/install-web.sh
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(steps.version.outputs.tag_name, 'beta') || contains(steps.version.outputs.tag_name, 'alpha') || contains(steps.version.outputs.tag_name, 'rc') }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
